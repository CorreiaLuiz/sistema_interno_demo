<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Criar senha — Área do Cliente Privilege</title>
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="stylesheet" href="../css/style.css">
</head>
<body class="login-page login-page-simples">
  <main class="login-form-area">
  <div class="login-card">
    <div class="icone-login"><img src="../assets/logo-mark.png" alt="Privilege"></div>
    <h2 id="titulo">Criar sua senha</h2>
    <p class="subtitulo" id="subtitulo">Verificando o link…</p>

    <form id="form-senha" style="display:none;">
      <div class="campo">
        <label for="nova-senha">Nova senha (mínimo 8 caracteres)</label>
        <input type="password" id="nova-senha" required minlength="8" autocomplete="new-password">
      </div>
      <div class="campo">
        <label for="confirmar-senha">Confirmar a senha</label>
        <input type="password" id="confirmar-senha" required minlength="8" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-full" id="btn-salvar">Salvar senha</button>
      <div class="erro-msg" id="erro-senha"></div>
    </form>

    <div class="links-login"><a href="/pages/cliente-login.html">← Ir para o login</a></div>
  </div>
  </main>

  <script src="../js/cliente-api.js"></script>
  <script>
    const bruto = new URLSearchParams(window.location.search).get('token') || '';
    const token = /^[a-f0-9]{48}$/.test(bruto) ? bruto : null;
    const subtitulo = document.getElementById('subtitulo');

    (async function iniciar() {
      if (!token) {
        subtitulo.textContent = 'Link inválido. Peça um novo ao escritório ou use "Esqueci minha senha" no login.';
        return;
      }
      try {
        const info = await clienteFetch(`/link-senha/${token}`, { semRedirecionar: true });
        if (info.tipo === 'recuperacao') document.getElementById('titulo').textContent = 'Criar nova senha';
        subtitulo.innerHTML = `Olá${info.nome ? ', <strong>' + esc(info.nome) + '</strong>' : ''}! ` +
          `Seu login é <strong>${esc(info.email)}</strong>. Escolha uma senha para entrar na Área do Cliente.`;
        document.getElementById('form-senha').style.display = 'block';
        document.getElementById('nova-senha').focus();
      } catch (err) {
        subtitulo.textContent = err.message;
      }
    })();

    document.getElementById('form-senha').addEventListener('submit', async (e) => {
      e.preventDefault();
      const erroEl = document.getElementById('erro-senha');
      erroEl.textContent = '';
      const novaSenha = document.getElementById('nova-senha').value;
      if (novaSenha !== document.getElementById('confirmar-senha').value) {
        erroEl.textContent = 'As senhas não são iguais.';
        return;
      }
      const btn = document.getElementById('btn-salvar');
      btn.disabled = true;
      try {
        const dados = await clienteFetch('/definir-senha', { method: 'POST', semRedirecionar: true, body: { token, novaSenha } });
        notificar(dados.mensagem, 'sucesso');
        setTimeout(() => {
          window.location.href = `/pages/cliente-login.html?email=${encodeURIComponent(dados.email)}`;
        }, 1200);
      } catch (err) {
        erroEl.textContent = err.message;
        btn.disabled = false;
      }
    });
  </script>
  <script src="../js/assistente.js"></script>
  <script src="../js/demo.js"></script>
</body>
</html>
